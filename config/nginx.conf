pid {{ .DataDir }}/nginx.pid;
daemon off;
worker_processes auto;

error_log syslog:server=unix:/dev/log,nohostname,tag={{ .NginxSyslogTag }} warn;

events {
    worker_connections 1024;
}

http {
    access_log syslog:server=unix:/dev/log,nohostname,tag={{ .NginxSyslogTag }};
    include {{ .AppDir }}/nginx/etc/nginx/mime.types;

    client_body_temp_path {{ .DataDir }}/nginx/client_body_temp;
    proxy_temp_path {{ .DataDir }}/nginx/proxy_temp;
    fastcgi_temp_path {{ .DataDir }}/nginx/fastcgi_temp;
    uwsgi_temp_path {{ .DataDir }}/nginx/uwsgi_temp;
    scgi_temp_path {{ .DataDir }}/nginx/scgi_temp;

    client_max_body_size 20m;

    upstream fmd {
        server unix:{{ .Socket }};
    }

    server {
        listen unix:{{ .CommonDir }}/web.socket;

        set_real_ip_from unix:;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        server_name localhost;

        include {{ .DataDir }}/config/authelia-location.conf;

        location = /syncloud {
            include {{ .DataDir }}/config/authelia-authrequest.conf;

            default_type text/html;
            alias {{ .DataDir }}/config/syncloud.html;
        }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Accept-Encoding "";

            sub_filter '</body>' '<a href="/syncloud" style="position:fixed;bottom:14px;left:14px;z-index:9999;padding:8px 14px;border-radius:8px;background:#334155;color:#fff;font:14px system-ui,sans-serif;text-decoration:none">Get registration token</a></body>';
            sub_filter_once on;

            proxy_pass http://fmd;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_redirect off;
        }
    }
}
